<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>

  <!-- 球拍（拍面 + 拍柄），斜向朝球 -->
  <g transform="rotate(-40 112 74)">
    <ellipse cx="112" cy="74" rx="37" ry="32" fill="#EF4444"/>
    <ellipse cx="112" cy="74" rx="37" ry="32" fill="none" stroke="#991B1B" stroke-width="3"/>
    <rect x="107" y="103" width="11" height="40" rx="5.5" fill="#F59E0B"/>
    <rect x="107" y="103" width="11" height="40" rx="5.5" fill="none" stroke="#B45309" stroke-width="2"/>
  </g>

  <!-- 乒乓球 + 旋转轨迹 -->
  <circle cx="64" cy="138" r="17" fill="#F8FAFC"/>
  <circle cx="64" cy="138" r="17" fill="none" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M86 144 Q80 130 64 126" fill="none" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

  <!-- 进阶三阶（由低到高） -->
  <path d="M28 152 h46" stroke="#A7F3D0" stroke-width="7" stroke-linecap="round"/>
  <path d="M28 165 h32" stroke="#A7F3D0" stroke-width="7" stroke-linecap="round"/>
  <path d="M28 178 h18" stroke="#A7F3D0" stroke-width="7" stroke-linecap="round"/>
</svg>
